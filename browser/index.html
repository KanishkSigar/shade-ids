<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHADE-IDS Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/stlite.css">
  <style>
    body { margin: 0; color: #192524; background: #f6f8f7; font: 16px/1.6 system-ui, sans-serif; }
    #start { max-width: 36rem; margin: 12vh auto; padding: 24px; }
    #dashboard { min-height: 100vh; }
    #dashboard[hidden] { display: none; }
  </style>
</head>
<body>
  <section id="start">
    <h1>SHADE-IDS</h1>
    <p id="status" role="status">Starting the dashboard. The first load downloads the Python runtime.</p>
    <p><a href="https://github.com/KanishkSigar/shade-ids">Source and local setup</a></p>
  </section>
  <main id="dashboard" hidden></main>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
